# Called by wheel.yml at the same source commit; never publishes independently.
name: Mac wheel

on:
  workflow_call:

permissions:
  contents: read

env:
  RELEASE_PLATFORM: darwin-arm64

jobs:
  build:
    name: Build darwin-arm64
    runs-on: [self-hosted, macOS, ARM64, "muse-glimmer-${{ github.run_id }}"]
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.13.0"
          python-version: "3.11"
          activate-environment: true
          enable-cache: false
      - name: Build wheel
        run: |
          uv pip install build
          python -m build --wheel
      - name: Record platform artifact
        run: python packaging/release.py record --platform '${{ env.RELEASE_PLATFORM }}' dist
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/*.whl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: muse-glimmer-${{ env.RELEASE_PLATFORM }}
          path: |
            dist/*.whl
            dist/release.json
            dist/SHA256SUMS
          if-no-files-found: error

  test:
    name: Test darwin-arm64 (Python ${{ matrix.python }})
    needs: build
    runs-on: [self-hosted, macOS, ARM64, "muse-glimmer-${{ github.run_id }}"]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.13.0"
          python-version: ${{ matrix.python }}
          activate-environment: true
          enable-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: muse-glimmer-${{ env.RELEASE_PLATFORM }}
          path: dist
      - name: Verify binary-only installation
        run: python packaging/check_wheel.py --install dist/*.whl
      - name: Install wheel and test dependencies
        run: |
          wheels=(dist/*.whl)
          uv pip install --only-binary=:all: "${wheels[0]}[dev]"
      - name: Run full test suite
        env:
          PYTHONPATH: ${{ github.workspace }}/python/src
          PYTHONDONTWRITEBYTECODE: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest tests -q --junitxml=reports/pytest.xml
      - name: Smoke test the installed wheel with a live model
        if: matrix.python == '3.13'
        run: python packaging/smoke_wheel.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-results-${{ env.RELEASE_PLATFORM }}-${{ matrix.python }}
          path: reports/
          if-no-files-found: warn
