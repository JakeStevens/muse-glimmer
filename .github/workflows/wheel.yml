# Release guide: .github/RELEASING.md
# PyPI Trusted Publisher: mergennachin / muse-glimmer / wheel.yml / pypi.
# Runner: Apple Silicon Mac with Git, Xcode/Metal and gh installed.
name: Build and release wheel

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: wheel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, macOS, ARM64, "muse-glimmer-${{ github.run_id }}"]
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.summary.outputs.version }}
      filename: ${{ steps.summary.outputs.filename }}
      sha256: ${{ steps.summary.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.13.0"
          python-version: "3.11"
          activate-environment: true
          enable-cache: false
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          assert os.environ["GITHUB_REF_NAME"] == f"v{version}", "Tag and package version differ"
          PY
      - name: Build wheel
        run: |
          test "$(uname -m)" = arm64
          uv pip install build
          python -m build --wheel
      - name: Summarize release artifact
        id: summary
        run: |
          python - <<'PY'
          import hashlib, json, os, tomllib
          from pathlib import Path
          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, f"Expected one wheel, found {wheels}"
          wheel = wheels[0]
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          digest = hashlib.sha256(wheel.read_bytes()).hexdigest()
          provenance = json.loads(Path("python/src/muse_glimmer/_vendor/provenance.json").read_text())
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\nfilename={wheel.name}\nsha256={digest}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(
                  f"## muse-glimmer {version}\n\n"
                  f"- Commit: `{os.environ['GITHUB_SHA']}`\n"
                  f"- ExecuTorch: `{provenance['revision']}`\n"
                  f"- Wheel: `{wheel.name}`\n"
                  f"- Size: {wheel.stat().st_size:,} bytes\n"
                  f"- SHA-256: `{digest}`\n"
              )
          PY
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          subject-path: dist/*.whl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: muse-glimmer-macos-arm64
          path: dist/*.whl
          if-no-files-found: error

  test:
    needs: build
    runs-on: [self-hosted, macOS, ARM64, "muse-glimmer-${{ github.run_id }}"]
    timeout-minutes: 15
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.13.0"
          python-version: ${{ matrix.python }}
          activate-environment: true
          enable-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: muse-glimmer-macos-arm64
          path: dist
      - name: Verify binary-only installation
        run: python packaging/check_wheel.py --install dist/*.whl

  publish:
    needs: [build, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, macOS, ARM64, "muse-glimmer-${{ github.run_id }}"]
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/muse-glimmer
    permissions:
      contents: read
      attestations: read
      id-token: write
    env:
      WHEEL_FILENAME: ${{ needs.build.outputs.filename }}
      WHEEL_SHA256: ${{ needs.build.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.13.0"
          python-version: "3.11"
          activate-environment: true
          enable-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: muse-glimmer-macos-arm64
          path: dist
      - name: Verify the tested artifact and its source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s  %s\n' "$WHEEL_SHA256" "dist/$WHEEL_FILENAME" | shasum -a 256 --check
          gh attestation verify "dist/$WHEEL_FILENAME" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/wheel.yml" \
            --source-digest "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF"
      - name: Attest and publish to PyPI
        run: |
          uv pip install pypi-attestations==0.0.31
          python -m pypi_attestations sign "dist/$WHEEL_FILENAME"
          python -m pypi_attestations verify attestation \
            --identity "$GITHUB_SERVER_URL/$GITHUB_WORKFLOW_REF" "dist/$WHEEL_FILENAME"
          uv publish --trusted-publishing always \
            "dist/$WHEEL_FILENAME" "dist/$WHEEL_FILENAME.publish.attestation"

  verify-pypi:
    needs: [build, publish]
    runs-on: [self-hosted, macOS, ARM64, "muse-glimmer-${{ github.run_id }}"]
    timeout-minutes: 15
    env:
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
      WHEEL_FILENAME: ${{ needs.build.outputs.filename }}
      WHEEL_SHA256: ${{ needs.build.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.13.0"
          python-version: "3.11"
          activate-environment: true
          enable-cache: false
      - name: Install pip
        run: uv pip install pip
      - name: Download the published version
        # Allow time for the new file to appear on PyPI's index.
        run: |
          for attempt in {1..12}; do
            python -m pip download --index-url https://pypi.org/simple \
              --only-binary=:all: --no-deps --no-cache-dir --timeout 15 --retries 0 \
              --dest dist "muse-glimmer==$RELEASE_VERSION" && break
            test "$attempt" -lt 12
            sleep 10
          done
      - name: Verify published bytes and installation
        run: |
          printf '%s  %s\n' "$WHEEL_SHA256" "dist/$WHEEL_FILENAME" | shasum -a 256 --check
          python packaging/check_wheel.py --install "dist/$WHEEL_FILENAME"
          printf 'Verified muse-glimmer %s from PyPI: checksum and binary-only installation passed.\n' \
            "$RELEASE_VERSION" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify PyPI provenance
        run: |
          uv pip install pypi-attestations==0.0.31
          python -m pypi_attestations verify pypi \
            --repository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "dist/$WHEEL_FILENAME"
